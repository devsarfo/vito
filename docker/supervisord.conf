[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
redirect_stderr=true

[program:octane]
user=root
autostart=1
autorestart=1
numprocs=1
command=/usr/bin/php /var/www/html/artisan octane:start --server=frankenphp --host=0.0.0.0 --port=8000
redirect_stderr=true
stdout_logfile=/var/www/html/storage/logs/octane.log
stopwaitsecs=10

[program:worker]
user=root
autostart=1
autorestart=1
numprocs=1
command=/usr/bin/php /var/www/html/artisan horizon
redirect_stderr=true
stdout_logfile=/var/www/html/storage/logs/worker.log
stopwaitsecs=3600
